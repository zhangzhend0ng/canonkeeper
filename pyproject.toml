[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsharness"
version = "0.2.0"
description = "网文长篇三级验证 harness：状态库 + 硬验证器（纯程序化规则引擎）+ 软验证器（persona 读者）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2,<2",
]
dev = [
    "pytest>=8.0,<10",
    "mypy>=1.8",
    "types-PyYAML",
    "mcp>=1.2,<2",
]

[project.scripts]
dsharness = "dsharness.cli:main"
dsharness-mcp = "dsharness.mcp:main"
# 遗留别名：deepseek-harness 的 CLI 也叫 dsh，同环境安装会撞名，优先用 dsharness
dsh = "dsharness.cli:main"

[tool.setuptools.packages.find]
include = ["dsharness*"]

[tool.setuptools.package-data]
dsharness = ["py.typed", "rules/builtin/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
