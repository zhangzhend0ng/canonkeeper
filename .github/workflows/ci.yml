name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装
        run: python -m pip install -e ".[dev]"
      - name: 单元测试
        run: python -m pytest
      - name: 类型检查
        run: python -m mypy canonkeeper
