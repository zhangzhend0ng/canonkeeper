# 注意：eval 在 GitHub 托管 runner 上运行；若 DeepSeek 账号启用 IP 白名单，
# 需改用自托管 runner，或换无 IP 限制的 provider（或临时关闭白名单）。
"on":
  workflow_dispatch:
    inputs:
      samples:
        description: "自洽采样遍数"
        type: string
        default: "3"

jobs:
  fixture-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装
        run: python -m pip install -e ".[dev]"
      - name: 合成 fixture 基准（回归门禁，需仓库 Secret DEEPSEEK_API_KEY）
        continue-on-error: true  # 若 API 账号有 IP 白名单/余额限制，此步黄但不阻塞；报告仍上传
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python evals/run_eval.py \
            --labels evals/labels/fixture.yaml \
            --texts evals/fixtures \
            --provider deepseek \
            --samples "${{ inputs.samples }}" \
            --out evals/results/ci-fixture.md
      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/ci-fixture.md
