# 评测基准：事实级查全标注
#
# 用途：衡量「结构化抽取」对章节关键事实的查全率（recall），替换手工对账。
# 版权边界：第三方版权文本的原文不入仓库（见 .gitignore books/ 与本目录说明），
# 标注只含事实与 ≤25 字定位引文（研究性注释用途）。
#
# 事实类型（kind）与匹配方式：
#   number  — 数值事实。value 按原文写法；命中=出现在抽取结果的「结构化字段」
#             （attrs 值 / event payload 值 / state_change old|new / story_time），
#             不含 quote 与 summary（那是原文回显，不算结构化捕获）。
#   entity  — 具名实体。命中=出现在本章抽取的 entities 名字或别名中（type 作参考不强制）。
#   attr    — 实体属性。命中=实体出现 ∧ attrs 存在模糊匹配的键 ∧ 值包含 value。
#   change  — 状态变更。命中=state_change 中实体+属性模糊匹配 ∧ new 包含 value。
#   event   — 情节节拍。命中=event.kind 与 kind_name 双向包含 ∧（如给 entities）全部出现。
#   relation— 关系。命中=relations 中双方匹配 ∧ kind 双向包含。
#   time    — 章节 day_offset。仅当 must:true 时计分（存疑标注用 must:false 并写 note）。
#   signal  — 软信号（伏笔/钩子/承诺）。keywords 任一出现在抽取 JSON 任意处即命中；
#             单列指标，不进主查全分。
#
# 每条 fact 可带 must: false（不计分，仅报告）；note 供漏报排查。

