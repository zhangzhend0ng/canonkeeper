# 人物类不变量（PLAN §4 ①②⑤⑫ 的可机检子集）
# 阶梯 ladder 是默认修仙体系；其他书可用自定义 YAML 以新 params 覆盖接入（见 examples/）。
- rule_id: CHAR_001
  name: 死亡后不得以活体出场（复生须登记）
  severity: high
  predicate: terminal_state_reuse
  params:
    attr: 生死
    terminal_value: 死亡
    revive_kinds: [复活, 复生]

- rule_id: CHAR_002
  name: 年龄随时间线单调（重生/回溯须登记）
  severity: medium
  predicate: numeric_attr_monotonic
  params:
    attr: 年龄
    regress_kinds: [重生, 穿越, 回溯, 转世]

- rule_id: CHAR_005
  name: 位置连续性（瞬移须登记）
  severity: low
  predicate: location_continuity
  params:
    location_attr: 位置

- rule_id: CHAR_012
  name: 境界单调（废功须登记）
  severity: high
  predicate: realm_regression
  params:
    attr: 境界
    ladder: [炼气, 筑基, 金丹, 元婴, 化神, 炼虚, 合体, 大乘, 渡劫]
    regress_kinds: [废功, 自废, 压制, 重修]
